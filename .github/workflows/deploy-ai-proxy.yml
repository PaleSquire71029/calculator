name: Deploy AI Proxy to Cloudflare Workers

on:
  push:
    branches: ["main"]
    paths:
      - "ai-proxy/**"
      - ".github/workflows/deploy-ai-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-proxy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run proxy tests
        run: npm test
        working-directory: ai-proxy

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-proxy
          command: deploy
