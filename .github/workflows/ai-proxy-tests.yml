name: Test AI proxy
on:
  push:
    branches: ["main"]
    paths:
      - "ai-proxy/**"
      - ".github/workflows/ai-proxy-tests.yml"
  pull_request:
    paths:
      - "ai-proxy/**"
      - ".github/workflows/ai-proxy-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: ai-proxy
