name = "zhixing-calculator-ai"
main = "src/index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[vars]
AI_BASE_URL = "https://api.a6api.com/v1"
AI_MODEL = "gpt-6-luna"
ALLOWED_ORIGINS = "https://c.zhixing.us.ci,https://zhixingjsq.pages.dev,https://palesquire71029.github.io"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ADMIN_STORE"
class_name = "AdminSettingsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdminSettingsStore"]
