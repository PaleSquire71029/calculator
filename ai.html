<style>
@font-face{font-family:"Noto Sans SC";font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/NotoSansSC-400.woff2?v=20261016") format("woff2")}

@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/JetBrainsMono-400.woff2?v=20261016") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:700;font-display:swap;src:url("./fonts/JetBrainsMono-700.woff2?v=20261016") format("woff2")}
:root{color-scheme:light;--ink:#26334a;--muted:#7b879c;--line:#e5eaf2;--blue:#4778db;--pale:#edf3ff;--shadow:0 10px 32px rgba(49,74,119,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"JetBrains Mono","Noto Sans SC",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
body{background:radial-gradient(ellipse at 0 0,#eaf1ff 0,transparent 35%),#f7f9fc}
button,input,textarea{font:inherit}
.app{width:min(900px,100%);min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:0 18px}
.top{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(220,228,240,.8)}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.01em}
.logo{display:grid;place-items:center;width:34px;height:34px;border:1px solid #fff;border-radius:12px;background:linear-gradient(145deg,#fff,#e2ebff);color:#4778db;box-shadow:0 4px 14px #7898d51c;font-size:19px}
.top-actions{display:flex;align-items:center;gap:8px}
.model-status{margin:7px 0 0;padding:5px 9px;border:1px solid #dfe8f7;border-radius:999px;background:#f0f5ff;color:#5875a6;font-size:10px;line-height:1.4;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;width:max-content}
.model-status[data-state="error"]{color:#a86a60;background:#fff5f1;border-color:#f3e1da}
.link,.plain{border:1px solid var(--line);border-radius:999px;background:#ffffffb8;color:#5b6f91;text-decoration:none;padding:8px 12px;font-size:12px;white-space:nowrap;cursor:pointer}
.settings{margin:10px 0 0}
.settings summary{width:max-content;color:#7d8ba2;font-size:12px;cursor:pointer;padding:5px 2px}
.settings-body{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffffc9;display:grid;gap:7px}
.settings-body label{font-size:12px;color:var(--muted)}
.proxy-row{display:flex;gap:8px}
.proxy-row input{min-width:0;flex:1;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:13px;outline:none}
.tiny{font-size:11px;line-height:1.5;color:var(--muted)}
.health{font-size:11px;color:var(--muted)}
.chat{flex:1;min-height:260px;padding:26px 0 18px;display:flex;flex-direction:column;gap:25px;overflow-wrap:anywhere}
.welcome{margin:auto;text-align:center;padding:42px 10px;color:var(--muted);line-height:1.8}
.welcome-mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 16px;border:1px solid white;border-radius:19px;background:linear-gradient(145deg,#fff,#e7efff);box-shadow:var(--shadow);font-size:25px;color:var(--blue)}
.welcome h1{font-size:clamp(23px,4vw,30px);color:#34435d;font-weight:700;margin:0 0 8px}
.welcome p{font-size:14px;margin:0}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;align-items:start;font-size:15px;line-height:1.9;min-width:0}
.avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:#eaf0fc;color:#4e72b6;font-size:12px;font-weight:700}
.msg.user .avatar{background:#e6f5ef;color:#34856d}
.content{min-width:0;padding-top:1px}
.content p{margin:0 0 10px}
.content p:last-child{margin-bottom:0}
.content ul,.content ol{padding-left:1.5em;margin:5px 0 12px}
.content blockquote{border-left:3px solid #c9d8f5;padding:2px 0 2px 12px;margin:8px 0;color:#667792}
.content pre{white-space:pre-wrap;overflow:auto;background:#f0f4fa;border:1px solid #e2e8f2;border-radius:11px;padding:12px;font:12px/1.65 "JetBrains Mono",monospace}
.content code{font: .9em "JetBrains Mono",monospace;background:#eef2f8;border-radius:4px;padding:1px 4px}
.content pre code{background:none;padding:0}
.content img{display:block;max-width:min(320px,100%);max-height:240px;object-fit:contain;border-radius:10px;margin-top:9px}
.content mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.composer-wrap{position:sticky;bottom:0;padding:12px 0 max(14px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#f7f9fc00,#f7f9fc 18%)}
.composer{border:1px solid #dce4f1;border-radius:20px;background:#ffffffed;box-shadow:0 8px 28px #415c8912;padding:11px 12px 10px;backdrop-filter:blur(16px)}
textarea{display:block;width:100%;min-height:54px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.7;padding:4px 3px}
textarea::placeholder{color:#9aa5b6}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:5px}
.actions{display:flex;align-items:center;gap:8px;min-width:0}
.btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:white;color:#657895;font-size:12px;cursor:pointer;white-space:nowrap}
.btn.send{width:39px;padding:0;border-color:#4778db;background:#4778db;color:white;font-size:18px;box-shadow:0 4px 10px #4778db35}
.btn:disabled{opacity:.55;cursor:wait}
#imageInput,#fileInput{display:none}
.attachment-area{position:relative}
.icon-btn{width:38px;height:36px;padding:0;display:grid;place-items:center;flex:none}
.icon-btn svg,.attachment-menu svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.attachment-btn{border-radius:12px;color:#5d7394;background:#fff}
.attachment-menu{position:absolute;z-index:5;left:0;bottom:45px;min-width:132px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(49,74,119,.13);display:grid;gap:3px}
.attachment-menu[hidden]{display:none}
.attachment-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:9px;background:transparent;color:#526782;padding:10px 11px;text-align:left;font-size:13px;cursor:pointer}
.attachment-menu button:active{background:#edf3ff}
.attachment-menu svg{width:18px;height:18px;flex:none}
.preview .icon-btn{border-radius:50%;width:30px;height:30px}
.preview{display:none;align-items:center;gap:9px;margin:7px 0;padding:7px;border-radius:11px;background:#f1f5fc}
.preview img{width:48px;height:48px;object-fit:cover;border-radius:7px}
.preview span{font-size:12px;flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-panel{margin:0 0 10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.account-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.account-row[hidden]{display:none}
.account-row input{min-width:0;flex:1 1 120px;width:100%;height:37px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;color:var(--ink);font:inherit;font-size:13px}
.account-row .btn{height:37px}
.account-status{font-size:12px;color:var(--muted);margin:0 0 8px}
.history-list{display:flex;gap:6px;overflow:auto;padding-top:9px}
.history-item{flex:none;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:#f7f9fd;color:#526782;padding:7px 9px;font-size:12px}
.history-item.active{border-color:#8eaceb;background:#edf3ff;color:#315db4}
.footnote{text-align:center;font-size:10px;color:#a0aabc;padding:0 0 8px}
.error{color:#b54848!important}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #ffffff80;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.app{padding:0 13px}.top{height:58px}.brand{font-size:14px}.link,.plain{padding:7px 10px;font-size:11px}.chat{padding:21px 0 14px;gap:22px}.msg{grid-template-columns:27px minmax(0,1fr);gap:9px;font-size:14px}.avatar{width:27px;height:27px}.welcome{padding:34px 8px}.welcome p{font-size:13px}.composer{border-radius:17px;padding:9px 10px}.btn{padding:0 10px}.btn.send{width:37px;padding:0}.footnote{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">✳</div><span>知行AI学习版</span></div>
  <div class="top-actions"><button class="plain" id="clearChat" type="button">新对话</button><a class="link" href="./index.html">返回计算器</a></div>

  <div class="account-status" id="accountStatus" aria-live="polite">登录后可同步云端文字对话；知行AI与学习版历史相互隔离，保留 90 天。</div>

  </div>
</details>
<main class="chat" id="chat" aria-live="polite">
  <div class="welcome"><div class="welcome-mark">✳</div><h1>有什么可以帮你？</h1><p>直接提问、连续追问，也可以上传图片、拍照或添加学习资料。</p></div>

    <div class="composer-bottom">

        <button class="btn icon-btn attachment-btn" id="attachmentBtn" type="button" aria-label="添加附件" title="添加附件" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.1 12 20.5a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>

          <button type="button" id="chooseFiles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>文件</button>
        </div>
        <input id="imageInput" type="file" accept="image/*" multiple>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ai-proxy/public/cloud-history.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const DEFAULT_PROXY='https://api.zhixing.us.ci';
const state={messages:[],images:[],files:[],busy:false,proxy:''};
try{
  state.proxy=localStorage.getItem('zx-ai-proxy-url')||sessionStorage.getItem('zx-ai-proxy')||'';
  if(state.proxy.replace(/\/+$/,'')==='https://zhixing-calculator-ai.xiaoshirong2023.workers.dev'){
    state.proxy=DEFAULT_PROXY;
    localStorage.setItem('zx-ai-proxy-url',state.proxy);
    sessionStorage.setItem('zx-ai-proxy',state.proxy);
  }
  if(!state.proxy)state.proxy=DEFAULT_PROXY;
}catch(e){state.proxy=DEFAULT_PROXY;}
$('proxyUrl').value=state.proxy;
function saveProxy(){state.proxy=$('proxyUrl').value.trim().replace(/\/$/,'');try{localStorage.setItem('zx-ai-proxy-url',state.proxy);sessionStorage.setItem('zx-ai-proxy',state.proxy);}catch(e){}}
$('proxyUrl').addEventListener('change',()=>{saveProxy();checkProxy();});
const attachmentMenu=$('attachmentMenu'),attachmentBtn=$('attachmentBtn');
function closeAttachmentMenu(){attachmentMenu.hidden=true;attachmentBtn.setAttribute('aria-expanded','false');}
attachmentBtn.addEventListener('click',()=>{attachmentMenu.hidden=!attachmentMenu.hidden;attachmentBtn.setAttribute('aria-expanded',String(!attachmentMenu.hidden));});
$('chooseImages').addEventListener('click',()=>{closeAttachmentMenu();$('imageInput').click();});
$('chooseCamera').addEventListener('click',()=>{closeAttachmentMenu();$('cameraInput').click();});
$('chooseFiles').addEventListener('click',()=>{closeAttachmentMenu();$('fileInput').click();});
document.addEventListener('click',e=>{if(!e.target.closest('.attachment-area'))closeAttachmentMenu();});
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function formatText(s){
 let x=escapeHtml(s);
 const blocks=[],mathBlocks=[];
 const tick=String.fromCharCode(96);
 x=x.replace(new RegExp(tick+tick+tick+'([\\s\\S]*?)'+tick+tick+tick,'g'),(_,code)=>{const n=blocks.push('<pre><code>'+code+'</code></pre>')-1;return 'ZXCODEBLOCK'+n+'END';});
 x=x.replace(new RegExp(tick+'([^'+tick+'\\n]+)'+tick,'g'),(_,code)=>{const n=blocks.push('<code>'+code+'</code>')-1;return 'ZXINLINECODE'+n+'END';});
 x=x.replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\\begin\{([a-zA-Z*]+)\}[\s\S]+?\\end\{\1\}|\$(?!\$)(?:\\.|[^$\n])+\$(?!\$)/g,formula=>{
  const n=mathBlocks.push(formula.replace(/&amp;/g,'&'))-1;return 'ZXMATHBLOCK'+n+'END';
 });
 x=x.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
 x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|\n)[-•] (.+)/g,'$1<li>$2</li>');
 x=x.replace(/\n/g,'<br>');
 x=x.replace(/(?:<br>){2,}/g,'<br><br>');
 x=x.replace(/ZXCODEBLOCK(\d+)END/g,(_,i)=>blocks[Number(i)]).replace(/ZXINLINECODE(\d+)END/g,(_,i)=>blocks[Number(i)]);
 x=x.replace(/ZXMATHBLOCK(\d+)END/g,(_,i)=>mathBlocks[Number(i)]||'');
 return x;
}
let mathTypesetQueue=Promise.resolve();
async function typeset(node){
 if(!node)return;
 mathTypesetQueue=mathTypesetQueue.catch(()=>{}).then(async()=>{
  for(let i=0;i<100&&!(window.MathJax&&window.MathJax.typesetPromise);i++)await new Promise(resolve=>setTimeout(resolve,100));
  if(!window.MathJax||!window.MathJax.typesetPromise)throw new Error('MathJax failed to load');
  if(window.MathJax.startup&&window.MathJax.startup.promise)await window.MathJax.startup.promise;
  if(window.MathJax.typesetClear)window.MathJax.typesetClear([node]);
  await window.MathJax.typesetPromise([node]);
 }).catch(err=>{
  console.warn('LaTeX rendering failed',err);
  node.classList.add('math-render-failed');
 });
 return mathTypesetQueue;
}
function welcome(){return '<div class="welcome"><div class="welcome-mark">✳</div><h1>有什么可以帮你？</h1><p>直接提问、追问，或上传题目图片。</p></div>';}
function render(){
 const host=$('chat');
 if(window.MathJax&&window.MathJax.typesetClear)window.MathJax.typesetClear([host]);
 host.innerHTML='';
 if(!state.messages.length){host.innerHTML=welcome();return;}
 state.messages.forEach(m=>{
  const node=document.createElement('article');node.className='msg '+m.role;
  const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=m.role==='user'?'你':'知';
  const content=document.createElement('div');content.className='content';content.innerHTML=formatText(m.text||'');
  (m.images|| (m.imageData?[m.imageData]:[])).forEach(src=>{const im=document.createElement('img');im.src=src;im.alt='你发送的图片';content.appendChild(im);});
  node.append(avatar,content);host.appendChild(node);
  typeset(content);
 });
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
window.zxAIApp={state,render,updateAttachments};
function setBusy(v){state.busy=v;$('send').disabled=v;$('send').innerHTML=v?'<span class="spinner"></span>':'↑';$('question').disabled=v;$('imageInput').disabled=v;}
function endpoint(){const raw=$('proxyUrl').value.trim();if(!raw)return '';try{const u=new URL(raw);if(!['https:','http:'].includes(u.protocol))return '';if(u.protocol==='http:'&&u.hostname!=='localhost'&&u.hostname!=='127.0.0.1')return '';if(u.pathname.endsWith('/api/chat'))return u.toString();return u.toString().replace(/\/$/,'')+'/api/chat';}catch(e){return '';}}
function setModelStatus(model,state){const el=$('modelStatus');if(model){el.textContent='当前模型：'+model;el.title='当前配置/返回的模型：'+model;el.dataset.state='ready';}else{el.textContent=state==='error'?'当前模型：暂时无法获取':state==='waiting'?'当前模型：等待连接':'当前模型：未连接';el.title=el.textContent;el.dataset.state=state||'waiting';}}
async function checkProxy(){
 const ep=endpoint();if(!ep){$('health').textContent='· 未配置';$('health').className='health';setModelStatus(null,'waiting');return;}
 $('health').textContent='· 检查中';
 try{const base=ep.replace(/\/api\/chat$/,'');const r=await fetch(base+'/health');const j=await r.json();$('health').textContent=j.configured?'· 已连接':'· 配置不完整';$('health').className='health'+(j.configured?'':' error');if(j.model)setModelStatus(j.model,j.configured?'ready':'error');else setModelStatus(null,j.configured?'error':'waiting');}
 catch(e){$('health').textContent='· 无法连接';$('health').className='health error';setModelStatus(null,'error');}
}
$('checkBtn').addEventListener('click',()=>{saveProxy();checkProxy();});
function resizeImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('请选择图片文件。'));const img=new Image();const src=URL.createObjectURL(file);img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(src);resolve(canvas.toDataURL('image/jpeg',.82));};img.onerror=()=>{URL.revokeObjectURL(src);reject(new Error('图片读取失败，请换一张图片。'));};img.src=src;});}
function updateAttachments(){
 $('preview').style.display=state.images.length?'flex':'none';
 if(state.images.length){$('previewImg').src=state.images[0].data;$('previewName').textContent=state.images.length>1?state.images[0].name+' 等 '+state.images.length+' 张图片':state.images[0].name+' · 已压缩';}
 else $('previewImg').removeAttribute('src');
 $('fileSummary').style.display=state.files.length?'block':'none';
 $('fileSummary').textContent=state.files.map(x=>'📄 '+x.name+'（已读取 '+x.text.length+' 字符）').join('；');
}
async function handleImages(files){
 for(const file of files){if(state.images.length>=4){alert('一次最多添加 4 张图片。');break;}try{const data=await resizeImage(file);state.images.push({data,name:file.name||'图片'});}catch(e){alert((file.name||'图片')+'：'+(e.message||'无法处理图片'));}}
 updateAttachments();if(state.images.length&&!$('question').value.trim())$('question').value='请看看这些图片并帮我分析。';autoResize();
}
$('imageInput').addEventListener('change',async()=>{const files=Array.from($('imageInput').files||[]);if(files.length)await handleImages(files);$('imageInput').value='';});
$('cameraInput').addEventListener('change',async()=>{const files=Array.from($('cameraInput').files||[]);if(files.length)await handleImages(files);$('cameraInput').value='';});
async function loadScript(src){
 return new Promise((resolve,reject)=>{const existing=Array.from(document.scripts).find(s=>s.src===src);if(existing){if(existing.dataset.loaded==='1')return resolve();existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}
 const s=document.createElement('script');s.src=src;s.onload=()=>{s.dataset.loaded='1';resolve();};s.onerror=()=>reject(new Error('读取组件加载失败，请检查网络后重试。'));document.head.appendChild(s);});
}
async function readDocument(file){
 const ext=(file.name.split('.').pop()||'').toLowerCase();
 if(file.size>12*1024*1024)throw new Error('文件超过 12 MB，请先压缩或拆分。');
 if(['txt','md','csv','json','html','xml','log','js','py','java','c','cpp','h','css','yaml','yml'].includes(ext)){
  const text=await file.text();return text.slice(0,80000);
 }
 if(ext==='pdf'){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const pdfjs=window.pdfjsLib;if(!pdfjs)throw new Error('PDF 解析组件未能加载。');
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let out='';
  for(let p=1;p<=Math.min(pdf.numPages,80);p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();out+='\n[第 '+p+' 页]\n'+tc.items.map(i=>i.str||'').join(' ');if(out.length>=80000)break;}
  return out.slice(0,80000);
 }
 if(ext==='docx'){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');
  if(!window.mammoth)throw new Error('DOCX 解析组件未能加载。');
  const result=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return result.value.slice(0,80000);
 }
 throw new Error('暂不支持该文件格式，请上传 PDF、DOCX 或文本类文件。');
}
$('fileInput').addEventListener('change',async()=>{
 const files=Array.from($('fileInput').files||[]);
 for(const file of files){
  if(state.files.length>=3){alert('一次最多添加 3 个文档。');break;}
  try{$('hint').textContent='正在读取 '+file.name+'…';const text=await readDocument(file);state.files.push({name:file.name,text});}
  catch(e){alert(file.name+'：'+(e.message||'读取失败'));}
 }
 $('hint').textContent='Enter 发送 · Shift+Enter 换行';updateAttachments();
 if(state.files.length&&!$('question').value.trim())$('question').value='请阅读我上传的资料，并帮我总结重点。';autoResize();$('fileInput').value='';
});
$('removeImage').addEventListener('click',()=>{state.images=[];state.files=[];updateAttachments();});
$('clearChat').addEventListener('click',()=>{if(state.busy)return;state.messages=[];state.images=[];state.files=[];updateAttachments();$('question').value='';autoResize();render();});
function autoResize(){const t=$('question');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px';}
$('question').addEventListener('input',autoResize);
async function send(){
 if(state.busy)return;
 const text=$('question').value.trim();if(!text&&!state.images.length&&!state.files.length){$('question').focus();return;}
 saveProxy();const ep=endpoint();if(!ep){$('settings').open=true;$('health').textContent='· 请先配置代理地址';$('health').className='health error';$('proxyUrl').focus();return;}
 const images=state.images.slice(),files=state.files.slice();
 let visibleText=text||(images.length?'请看看这些图片并帮我分析。':'请阅读我上传的资料，并帮我总结重点。');
 if(files.length)visibleText+='\n\n【附件资料】\n'+files.map(f=>'文件：'+f.name+'\n'+f.text).join('\n\n---\n\n');
 const cloudMessageId=window.zxCloudHistory?.messageId?.();
 setBusy(true);
 state.messages.push({role:'user',text:visibleText,images:images.map(x=>x.data)});
 if(window.zxCloudHistory){try{await window.zxCloudHistory.ensureConversation(visibleText);await window.zxCloudHistory.saveMessage('user',visibleText,cloudMessageId);}catch(cloudError){const el=$('accountStatus');if(el)el.textContent='云端保存暂不可用：'+cloudError.message;}}
 const apiMessages=state.messages.map(m=>{
  if(m.role==='user'&&m.images&&m.images.length){
   return {role:m.role,content:[{type:'text',text:m.text},...m.images.map(src=>({type:'image_url',image_url:{url:src}}))]};
  }
  return {role:m.role,content:m.text};
 });
 $('question').value='';autoResize();state.images=[];state.files=[];updateAttachments();render();
 try{
  const response=await fetch(ep,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'general',messages:apiMessages})});
  let data={};try{data=await response.json();}catch(e){}
  if(!response.ok)throw new Error(data.error||'请求失败（HTTP '+response.status+'）');
  if(typeof data.answer!=='string'||!data.answer.trim())throw new Error('模型没有返回文字答案。');
  if(data.model)setModelStatus(data.model,'ready');
  state.messages.push({role:'assistant',text:data.answer});
  if(window.zxCloudHistory){try{await window.zxCloudHistory.saveMessage('assistant',data.answer);}catch(cloudError){const el=$('accountStatus');if(el)el.textContent='回答已生成，但云端保存失败：'+cloudError.message;}}
 }catch(e){state.messages.push({role:'assistant',text:'请求未完成：'+(e.message||'网络错误')+'\n\n请检查代理地址、模型配置和网络后重试。'});}
 finally{setBusy(false);render();$('question').focus();if(window.zxCloudHistory)window.zxCloudHistory.refresh(false).catch(()=>{});}
}
$('send').addEventListener('click',send);
$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
window.addEventListener('load',()=>typeset($('chat')));
checkProxy();
})();
</script>
